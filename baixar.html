<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baixar AllStar</title>
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#1a1c2c">
<style>
:root{--bg:#1a1c2c;--card:#24263d;--gold:#ffd23f;--txt:#fff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 30%,#2a2448,var(--bg) 70%);color:var(--txt);font-family:monospace;display:flex;align-items:center;justify-content:center;padding:16px}
.box{max-width:420px;width:100%;text-align:center;background:var(--card);border:3px solid #ffffff22;border-radius:18px;padding:24px 18px}
img{width:128px;height:128px;image-rendering:pixelated;border-radius:24px}
h1{font-size:30px;color:var(--gold);letter-spacing:2px;margin:12px 0 4px;text-shadow:0 3px 0 #b8860b,0 6px 0 #000}
p{opacity:.85;line-height:1.45;margin:8px 0}
a.btn{display:block;margin:18px 0 10px;padding:16px;border-radius:14px;background:linear-gradient(#43a047,#2e7d32);border:3px solid #fff;color:#fff;font:bold 20px monospace;text-decoration:none}
a.play{display:block;color:var(--gold);margin-top:6px}
ol{text-align:left;padding-left:22px;line-height:1.5;opacity:.85;font-size:14px}
</style></head><body>
<div class="box">
<img src="icon-512.png" alt="AllStar">
<h1>ALLSTAR</h1>
<p>Colecione lutadores, explore e jogue com os amigos.</p>
<a class="btn" href="AllStar.apk" download>Baixar o app (Android)</a>
<ol>
<li>Toque em <b>Baixar o app</b> e abra o arquivo quando terminar.</li>
<li>Se o celular pedir, permita instalar apps desta fonte.</li>
<li>Já tem o app? Instale por cima: o progresso não se perde.</li>
</ol>
<a class="play" href="./">Ou jogue direto no navegador</a>
</div>
</body></html>
